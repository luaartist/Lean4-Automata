user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
  worker_connections 2048;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65s;
  keepalive_requests 1000;
  types_hash_max_size 2048;
  server_tokens off;
  charset utf-8;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';
  access_log /var/log/nginx/access.log main;
  error_log /var/log/nginx/error.log warn;

  # ── Rate-limit & connection-cap zones (security hardening, Phase 4) ────
  # Authoritative caps for SSE concurrency and search burst protection. The
  # FastAPI app enforces a per-process SSE cap as defense-in-depth, but Nginx
  # is the source of truth in production.
  limit_conn_zone   $binary_remote_addr zone=sse_conn:10m;
  limit_req_zone    $binary_remote_addr zone=search_req:10m rate=60r/m;

  server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # SSE: disable proxy buffering, allow long-lived connections, cap per-IP.
    location /api/v1/events/ {
      resolver 127.0.0.11 ipv6=off valid=10s;
      set $upstream http://app:8000;
      proxy_pass $upstream;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";

      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;

      limit_conn sse_conn 10;
      limit_conn_status 429;
    }

    # Search endpoint: 60 requests/minute/IP burst-friendly.
    location /api/v1/symbols/search {
      resolver 127.0.0.11 ipv6=off valid=10s;
      set $upstream http://app:8000;
      proxy_pass $upstream;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      limit_req zone=search_req burst=20 nodelay;
      limit_req_status 429;
    }

    # Admin / ingestion API routes — low-traffic, no rate limiting.
    location /admin/ {
      resolver 127.0.0.11 ipv6=off valid=10s;
      set $upstream_ingestion http://app_ingestion:8001;
      rewrite ^/admin/(.*)$ /$1 break;
      proxy_pass $upstream_ingestion;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_connect_timeout 5s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
    }

    location / {
      resolver 127.0.0.11 ipv6=off valid=10s;
      set $upstream http://app:8000;
      proxy_pass $upstream;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_set_header Connection "";

      proxy_connect_timeout 5s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
      send_timeout 60s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
    }
  }
}
