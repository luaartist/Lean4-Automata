services:
  postgres:
    image: postgres:18.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lean4_automata}
      POSTGRES_USER: ${POSTGRES_USER:-lean4}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lean4_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"${POSTGRES_USER:-lean4}\" -d \"${POSTGRES_DB:-lean4_automata}\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:8.0
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  nginx:
    image: nginx:1.30.1
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "nginx -t || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: lean4-automata-worker:dev
    restart: unless-stopped
    command: ["celery", "-A", "workers.celery_app", "worker", "--loglevel=info", "--concurrency=4"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  watcher:
    image: lean4-automata-worker:dev
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    command: ["python", "-m", "parser.watcher"]
    env_file:
      - .env
    environment:
      LEAN_WATCH_ROOT: /lean-src
      LEAN_PROJECT_ID: ${LEAN_PROJECT_ID:-1}
    volumes:
      - ${LEAN_WATCH_ROOT:-./lean-src}:/lean-src:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  flower:
    image: mher/flower:2.0
    restart: unless-stopped
    command: ["celery", "--broker=${REDIS_URL:-redis://redis:6379}", "flower", "--port=5555"]
    environment:
      CELERY_BROKER_URL: ${REDIS_URL:-redis://redis:6379}
      CELERY_RESULT_BACKEND: ${REDIS_URL:-redis://redis:6379}
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
